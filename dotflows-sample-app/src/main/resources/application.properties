spring.application.name=dotflows-sample

# An in-memory database keeps the sample self-contained: everything is lost on restart.
# Point these at PostgreSQL to keep definitions and instances.
spring.datasource.url=jdbc:h2:mem:dotflows;DB_CLOSE_DELAY=-1
#spring.datasource.url=jdbc:postgresql://localhost:5432/dotflows
#spring.datasource.username=postgres
#spring.datasource.password=postgres

# Values HTTP tasks can use as ${name}. Real keys belong in the environment, not in this file.
dotflows.http.variables.demo-api-key=${DEMO_API_KEY:not-a-real-key}

dotflows.worker.poll-interval=500ms
